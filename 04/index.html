
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - 스마트 다이어트 관리</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2ecc71;
            --primary-dark: #27ae60;
            --danger-color: #e74c3c;
            --text-color: #2c3e50;
            --sub-text: #7f8c8d;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 28px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .gender-group {
            display: flex;
            gap: 12px;
        }

        .gender-group label {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: normal;
        }

        .gender-group input[type="radio"] {
            display: none;
        }

        .gender-group input[type="radio"]:checked + span {
            font-weight: bold;
            color: var(--primary-dark);
        }

        .gender-group label:has(input[type="radio"]:checked) {
            border-color: var(--primary-color);
            background-color: #e8f8f0;
        }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--primary-dark);
        }

        /* 결과 화면 */
        .result-screen {
            display: none;
        }

        .alert-box {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .alert-danger {
            background-color: #fde8e8;
            color: var(--danger-color);
            border: 1px solid #f8b4b4;
        }

        .alert-normal {
            background-color: #e8f8f0;
            color: var(--primary-dark);
            border: 1px solid #a3e6cd;
        }

        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--primary-dark);
        }

        .card p, .card li {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #4a5568;
        }

        .card ul {
            list-style-type: none;
            padding-left: 0;
        }

        .card li {
            margin-bottom: 6px;
            padding-left: 14px;
            position: relative;
        }

        .card li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }

        .btn-reset {
            width: 100%;
            padding: 10px;
            background-color: #edf2f7;
            color: #4a5568;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 입력 폼 화면 -->
    <div id="inputScreen">
        <h1>🌱 맞춤 다이어트 설계</h1>
        <form id="dietForm">
            <div class="form-group">
                <label for="userName">이름</label>
                <input type="text" id="userName" placeholder="이름을 입력하세요" required>
            </div>

            <div class="form-group">
                <label>성별</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="male" checked> <span>남성</span></label>
                    <label><input type="radio" name="gender" value="female"> <span>여성</span></label>
                </div>
            </div>

            <div class="form-group">
                <label for="birthDate">생년월일</label>
                <input type="date" id="birthDate" required>
            </div>

            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label for="height">키 (cm)</label>
                    <input type="number" id="height" placeholder="170" min="100" max="250" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="weight">몸무게 (kg)</label>
                    <input type="number" id="weight" placeholder="65" min="30" max="200" required>
                </div>
            </div>

            <div class="form-group">
                <label for="job">하는 일 (활동량)</label>
                <select id="job" required>
                    <option value="low">사무직 / 주로 앉아서 하는 일 (활동량 낮음)</option>
                    <option value="medium">서비스직 / 서서 일하거나 적당한 활동 (활동량 보통)</option>
                    <option value="high">현장직 / 육체 노동 또는 강도 높은 활동 (활동량 높음)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">내 맞춤 플랜 보기</button>
        </form>
    </div>

    <!-- 결과 화면 -->
    <div id="resultScreen" class="resultScreen">
        <h1>📊 <span id="resName"></span>님의 오늘 분석 결과</h1>

        <!-- 체지방률 경고/안내 박스 -->
        <div id="fatAlertBox" class="alert-box"></div>

        <!-- 1. 오늘 활동량 및 분석 결과 -->
        <div class="card">
            <h3>📈 건강 및 활동 분석</h3>
            <p><strong>추정 체지방률:</strong> <span id="resFatRatio"></span>%</p>
            <p><strong>일일 권장 섭취량:</strong> <span id="resCalorie"></span> kcal</p>
            <p><strong>오늘 권장 활동량:</strong> <span id="resActivity"></span></p>
        </div>

        <!-- 2. 맞춤 식단 조절 -->
        <div class="card">
            <h3>🥗 추천 식단 플랜</h3>
            <ul id="resDiet"></ul>
        </div>

        <!-- 3. 체조 및 운동 추천 -->
        <div class="card">
            <h3>🏃‍♂️ 오늘 추천 체조 & 운동</h3>
            <ul id="resWorkout"></ul>
        </div>

        <button type="button" class="btn-reset" onclick="resetForm()">다시 입력하기</button>
    </div>
</div>

<script>
    document.getElementById('dietForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 입력 값 가져오기
        const name = document.getElementById('userName').value;
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const birthDate = new Date(document.getElementById('birthDate').value);
        const height = parseFloat(document.getElementById('height').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const job = document.getElementById('job').value;

        // 나이 계산
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }

        // BMI 기준 체지방률 추정 계산식 (Deurenberg 공식 기반)
        const bmi = weight / ((height / 100) * (height / 100));
        const genderFactor = (gender === 'male') ? 1 : 0;
        let bodyFat = (1.20 * bmi) + (0.23 * age) - (10.8 * genderFactor) - 5.4;
        bodyFat = Math.max(5, Math.min(50, bodyFat)).toFixed(1); // 범주 제한

        // 정상 체지방률 기준 (남성: 10~20%, 여성: 18~28%)
        const isOverFat = (gender === 'male' && bodyFat > 20) || (gender === 'female' && bodyFat > 28);

        // 결과 반영 - 안내 메시지
        const alertBox = document.getElementById('fatAlertBox');
        if (isOverFat) {
            alertBox.className = "alert-box alert-danger";
            alertBox.innerText = "🚨 체지방률이 정상 범위를 넘어섰습니다! 그만 먹어!";
        } else {
            alertBox.className = "alert-box alert-normal";
            alertBox.innerText = "✨ 체지방률이 정상 범위 내에 있습니다. 꾸준히 유지해 보세요!";
        }

        // 결과 반영 - 활동량 및 칼로리
        let activityText = "";
        let baseCalorie = 2000;
        if (job === 'low') {
            activityText = "낮음 (주로 앉아서 생활) - 하루 6,000보 걷기 권장";
            baseCalorie = (gender === 'male') ? 2100 : 1700;
        } else if (job === 'medium') {
            activityText = "보통 (지속적인 이동 및 활동) - 하루 8,000보 걷기 권장";
            baseCalorie = (gender === 'male') ? 2400 : 1900;
        } else {
            activityText = "높음 (강도 높은 육체 활동) - 하루 10,000보 이상 활동 권장";
            baseCalorie = (gender === 'male') ? 2700 : 2200;
        }

        // 감량을 위한 칼로리 조절 (-400kcal)
        const targetCalorie = isOverFat ? baseCalorie - 400 : baseCalorie;

        document.getElementById('resName').innerText = name;
        document.getElementById('resFatRatio').innerText = bodyFat;
        document.getElementById('resCalorie').innerText = targetCalorie;
        document.getElementById('resActivity').innerText = activityText;

        // 결과 반영 - 식단 추천
        const dietList = document.getElementById('resDiet');
        dietList.innerHTML = `
            <li><strong>아침:</strong> 현미밥 1/2공기, 계란후라이, 샐러드, 사과 반 개</li>
            <li><strong>점심:</strong> 일반식 2/3공기 (단백질 위주 반찬 + 채소 섭취)</li>
            <li><strong>저녁:</strong> 닭가슴살 샐러드 또는 두부 구이 + 데친 브로콜리</li>
            <li><strong>간식:</strong> 견과류 한 주먹 또는 무당 플레인 요거트</li>
        `;

        // 결과 반영 - 운동 추천
        const workoutList = document.getElementById('resWorkout');
        workoutList.innerHTML = `
            <li><strong>전신 스트레칭:</strong> 기상 직후 및 잠들기 전 10분 스트레칭</li>
            <li><strong>유산소 체조:</strong> 타바타 홈트레이닝 15분 (점핑잭, 버피테스트 등)</li>
            <li><strong>근력 운동:</strong> 스쿼트 20회 x 3세트, 플랭크 45초 x 3세트</li>
        `;

        // 화면 전환
        document.getElementById('inputScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
    });

    function resetForm() {
        document.getElementById('dietForm').reset();
        document.getElementById('inputScreen').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
    }
</script>

</body>
</html>
